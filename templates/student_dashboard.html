<!DOCTYPE html>

<html>

<head>


    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg,
                    #667eea,
                    #764ba2);
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 20px;
        }
    </style>

</head>

<body>

    <div class="container py-5">


        <h1 class="text-center text-white mb-5">

            Welcome {{ student[1] }} 👋

        </h1>

        <div class="row">

            <div class="col-md-4">

                <div class="card shadow p-4 text-center">

                    <h5>Attendance</h5>

                    <h1 class="text-success">

                        {{ student[4] }}

                    </h1>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow p-4 text-center">

                    <h5>Total Marks</h5>

                    <h1 class="text-primary">

                        {{ student[5] }}

                    </h1>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow p-4 text-center">

                    <h5>Performance</h5>

                    <h4 class="text-warning">

                        {{ performance }}

                    </h4>

                </div>

            </div>

        </div>

        <div class="card shadow p-4 mt-5">

            <h3>Student Profile</h3>

            <hr>

            <p><strong>Name:</strong> {{ student[1] }}</p>

            <p><strong>Age:</strong> {{ student[2] }}</p>

            <p><strong>Course:</strong> {{ student[3] }}</p>

            <p><strong>Attendance:</strong> {{ student[4] }}</p>

            <p><strong>Total Marks:</strong> {{ student[5] }}</p>

        </div>

        <div class="text-center mt-4">

            <a href="/logout" class="btn btn-danger">

                Logout

            </a>

        </div>


    </div>

</body>

</html>
