<!DOCTYPE html>
<html>

<head>

    <title>AI Prediction</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow-lg p-5 text-center">

            <h1 class="mb-3">
                🤖 AI Performance Prediction
            </h1>

            <hr>

            <h4 class="mt-3">
                Total Marks
            </h4>

            <h1 class="display-4 fw-bold text-primary">
                {{ marks }}
            </h1>

            <hr>

            {% if result == "Excellent Student" %}

            <div class="alert alert-success fs-4">

                🏆 {{ result }}

            </div>

            {% elif result == "Good Student" %}

            <div class="alert alert-primary fs-4">

                ⭐ {{ result }}

            </div>

            {% elif result == "Average Student" %}

            <div class="alert alert-warning fs-4">

                📘 {{ result }}

            </div>

            {% else %}

            <div class="alert alert-danger fs-4">

                ⚠️ {{ result }}

            </div>

            {% endif %}

            <div class="mt-4">

                <a href="/students"
                    class="btn btn-dark btn-lg">

                    ← Back

                </a>

            </div>

        </div>

    </div>

</body>

</html>
